<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancorithmics - Commit 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 class="logo">Bancorithmics</h1>
        </header>
        <!-- Bloque principal -->
        <main class="main-content">
            <section class="contenedor-balance">
                <span class="label">DISPONIBLE</span>
                <div class="amount-main">$ 1.000.000</div>
                <span class="label">TOTAL</span>
                <div class="amount-sub">$ 1.500,00</div>
            </section>

            <!-- CRUD Botones de navegar -->
            <section class="crud-actions">
                <button class="btn btn-income">+ Ingresos</button>
                <button class="btn btn-expense">- Egresos</button>
            </section>
        </main>
    </div>
</body>
</html>
