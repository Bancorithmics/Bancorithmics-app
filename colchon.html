<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bancorithmics - Colchón</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="paginas.css">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-S5T40TL12E"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    
      gtag('config', 'G-S5T40TL12E');
    </script>
</head>
<body>
    <div class="dashboard">
        <aside class="sidebar"></aside>

        <main class="main">
            <header class="main-header">
                <div class="header-title-wrapper">
                    <a href="index.html" class="back-link">&larr; Volver</a>
                    <div>
                        <h1 class="page-title">colchón</h1>
                        <p class="page-subtitle">Tu fondo de emergencia, separado del día a día</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button class="btn-primary" id="btn-ingresar">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
                        Ingresar dinero
                    </button>
                </div>
            </header>

            <!-- Tarjeta principal -->
            <section class="tarjeta-destacada">
                <div class="colchon-cabecera">
                    <div class="colchon-icono">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8V6a5 5 0 0110 0v2"/></svg>
                    </div>
                    <div>
                        <span class="summary-label">Dinero en el colchón</span>
                        <div class="colchon-saldo" id="colchon-saldo">$0</div>
                    </div>
                    <div class="colchon-acciones">
                        <button class="btn-secundario" id="btn-retirar">Retirar</button>
                        <button class="btn-secundario" id="btn-meta">Editar meta</button>
                    </div>
                </div>

                <div class="meta-info">
                    <span>Meta: <b id="colchon-meta">$0</b></span>
                    <span><b id="colchon-porcentaje">0%</b> completado</span>
                </div>
                <div class="progress-bar alta">
                    <div class="progress-fill fill-blue" id="colchon-barra" style="width:0%"></div>
                </div>

                <div class="consejo">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7V17h8v-2.3A7 7 0 0012 2z"/></svg>
                    <div id="texto-consejo"></div>
                </div>
            </section>

            <!-- Historial -->
            <section class="panel">
                <div class="panel-header">
                    <h2 class="panel-title">Movimientos del colchón</h2>
                </div>
                <div class="historial" id="historial-colchon"></div>
            </section>
        </main>
    </div>

    <!-- Modal de operaciones -->
    <div class="modal-overlay" id="modal-colchon" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="titulo-colchon">
            <div class="modal-header-box">
                <button class="modal-close" data-close-modal aria-label="Cerrar">&times;</button>
                <h2 id="titulo-colchon">Colchón</h2>
                <span class="modal-pocket-amount" id="modal-colchon-saldo">$0</span>
                <span class="modal-pocket-goal" id="modal-colchon-meta">Meta: $0</span>
            </div>

            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="ingresar">Ingresar</button>
                <button class="modal-tab" data-tab="retirar">Retirar</button>
                <button class="modal-tab" data-tab="meta">Meta</button>
            </div>

            <div class="modal-body">
                <div class="tab-panel active" id="tab-ingresar">
                    <div class="modal-resumen">
                        <span>Saldo disponible<b id="disponible-ingresar">$0</b></span>
                        <span>Falta para la meta<b id="falta-colchon">$0</b></span>
                    </div>
                    <label for="input-ingresar">¿Cuánto quieres guardar?</label>
                    <div class="campo-monto">
                        <span class="simbolo">$</span>
                        <input type="text" class="modal-input" id="input-ingresar" placeholder="0">
                    </div>
                    <div class="chips-monto" id="chips-ingresar"></div>
                    <p class="mensaje-error" id="error-ingresar"></p>
                    <button class="btn-action btn-verde" id="btn-confirm-ingresar">Guardar en el colchón</button>
                </div>

                <div class="tab-panel" id="tab-retirar">
                    <div class="modal-resumen">
                        <span>En el colchón<b id="saldo-retirar">$0</b></span>
                        <span>Volverá a<b>Saldo disponible</b></span>
                    </div>
                    <label for="input-retirar">¿Cuánto necesitas retirar?</label>
                    <div class="campo-monto">
                        <span class="simbolo">$</span>
                        <input type="text" class="modal-input" id="input-retirar" placeholder="0">
                    </div>
                    <div class="chips-monto" id="chips-retirar"></div>
                    <p class="mensaje-error" id="error-retirar"></p>
                    <button class="btn-action" id="btn-confirm-retirar">Retirar a disponible</button>
                </div>

                <div class="tab-panel" id="tab-meta">
                    <label for="input-meta-colchon">Meta del fondo de emergencia</label>
                    <div class="campo-monto">
                        <span class="simbolo">$</span>
                        <input type="text" class="modal-input" id="input-meta-colchon" placeholder="0">
                    </div>
                    <p class="modal-subtext" id="sugerencia-meta"></p>
                    <button class="btn-action" id="btn-confirm-meta-colchon">Guardar meta</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="js/store.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/colchon.js"></script>
</body>
</html>
